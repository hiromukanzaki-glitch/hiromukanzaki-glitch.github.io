<style>
:root{
  --bg:#F4F5F5; --surface:#FFFFFF; --surface-2:#F6F8F8; --ink:#222B2E; --ink-2:#5C676B; --line:#DADFE0;
  --stripe:#008DA3; --stripe-ink:#FFFFFF; --emg:#D63B2F;
  --ok:#1E8A4C; --ok-bg:#E4F3EA; --wait:#B26E0A; --wait-bg:#FCF0DC; --ng:#6B7579; --ng-bg:#EDEFF0;
  --sev3:#D63B2F; --sev2:#E0861F; --sev1:#4A90C8; --focus:#008DA3;
  --serif:"M PLUS 1","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101719; --surface:#182224; --surface-2:#1E2B2E; --ink:#E7EEEF; --ink-2:#A0AFB2; --line:#2E3D40;
    --stripe:#2FB3C6; --emg:#FF6A5C; --ok:#3CBF76; --ok-bg:#163223; --wait:#F0B04A; --wait-bg:#352A12; --ng:#93A1A5; --ng-bg:#243134;
    --sev3:#FF6A5C; --sev2:#F2A145; --sev1:#73B4E6; --focus:#5CC8D8; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101719; --surface:#182224; --surface-2:#1E2B2E; --ink:#E7EEEF; --ink-2:#A0AFB2; --line:#2E3D40;
  --stripe:#2FB3C6; --emg:#FF6A5C; --ok:#3CBF76; --ok-bg:#163223; --wait:#F0B04A; --wait-bg:#352A12; --ng:#93A1A5; --ng-bg:#243134;
  --sev3:#FF6A5C; --sev2:#F2A145; --sev1:#73B4E6; --focus:#5CC8D8; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"M PLUS 1","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif;font-size:16px;line-height:1.6}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
a{color:var(--stripe)}

header.bar{background:var(--surface);border-bottom:1px solid var(--line)}
.stripe{height:4px;background:var(--stripe)}
.bar-inner{max-width:1240px;margin:0 auto;padding:12px 20px 10px;display:flex;flex-wrap:wrap;gap:6px 20px;align-items:center;justify-content:space-between}
h1{font-family:var(--serif);font-size:1.25rem;font-weight:800;margin:0;letter-spacing:.02em;color:var(--stripe)}
.bar-sub{color:var(--ink-2);font-size:.8125rem;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.conn{display:inline-flex;align-items:center;gap:6px}
.conn i{width:9px;height:9px;border-radius:50%;background:var(--ng);display:inline-block}
.conn.on i{background:var(--ok)}
.conn.off i{background:var(--wait)}

.wrap{max-width:1240px;margin:0 auto;padding:16px 20px 32px}
.narrow{max-width:640px;margin:0 auto;padding:12px 12px 32px}
.demo{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:6px;min-width:0}
.pane-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pane-head h2{margin:0;font-size:1.125rem;font-family:var(--serif);font-weight:700;letter-spacing:.04em}
.role{font-size:.8125rem;color:var(--ink-2)}
.pane-body{padding:16px 18px 20px}

/* start */
.start h2{font-family:var(--serif);font-weight:700;font-size:1.25rem;margin:4px 0 6px}
.start p.lead{margin:0 0 18px;color:var(--ink-2);max-width:62ch}
.pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:12px}
.card h3{margin:0;font-family:var(--serif);font-weight:700;font-size:1.125rem}
.card .top{border-top:5px solid var(--stripe);margin:-18px -18px 0;border-radius:10px 10px 0 0}
.card.hos .top{border-top-color:var(--stripe)}
.qr{display:flex;gap:16px;align-items:center}
.qrbox{background:#fff;padding:8px;border-radius:6px;border:1px solid var(--line);width:156px;height:156px;flex:none}
.qrbox svg{display:block;width:140px;height:140px}
.qr p{margin:0;font-size:.8125rem;color:var(--ink-2)}
.big{display:block;width:100%;padding:14px;border:0;border-radius:10px;background:var(--stripe);color:#fff;font-weight:700;font-size:1.0625rem;cursor:pointer;text-align:center;text-decoration:none}

.notes{margin-top:22px;font-size:.875rem;color:var(--ink-2)}
.notes li{margin-bottom:4px}

fieldset{border:0;margin:0 0 16px;padding:0;min-width:0}
legend{font-weight:700;font-size:.9375rem;margin-bottom:6px;padding:0}
.row{display:flex;flex-wrap:wrap;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{display:inline-block;padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2);cursor:pointer;user-select:none}
.chip input:checked + span{background:var(--stripe);color:#fff;border-color:var(--stripe)}
.chip input:focus-visible + span{outline:3px solid var(--focus);outline-offset:2px}
.sev .chip input:checked + span.s3{background:var(--sev3);border-color:var(--sev3);color:#fff}
.sev .chip input:checked + span.s2{background:var(--sev2);border-color:var(--sev2);color:#fff}
.sev .chip input:checked + span.s1{background:var(--sev1);border-color:var(--sev1);color:#fff}
label.field{display:flex;flex-direction:column;gap:4px;font-size:.8125rem;color:var(--ink-2)}
label.field input,label.field select{font-size:1rem;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:7.5em}
label.field select{width:auto;min-width:10em}
.hint{font-size:.8125rem;color:var(--ink-2);margin:4px 0 0}
.send{width:100%;padding:18px;border:0;border-radius:6px;background:var(--stripe);color:var(--stripe-ink);font-size:1.1875rem;font-weight:700;cursor:pointer}
.send:disabled{opacity:.45;cursor:not-allowed}
.ghost{padding:9px 14px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;text-decoration:none;color:var(--ink);display:inline-block}

.summary{background:var(--surface-2);border-radius:8px;padding:12px 14px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.sev-badge{font-weight:700;color:#fff;padding:2px 10px;border-radius:4px;font-size:.875rem}
.sev-badge.s3{background:var(--sev3)}.sev-badge.s2{background:var(--sev2)}.sev-badge.s1{background:var(--sev1)}
.clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.5rem;margin-left:auto}
.clock small{font-size:.75rem;font-weight:400;color:var(--ink-2);margin-right:6px}
.counts{display:flex;gap:16px;margin:0 0 10px;font-size:.875rem;color:var(--ink-2)}
.counts b{font-size:1.125rem;color:var(--ink);font-variant-numeric:tabular-nums}
ul.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
ul.list li{display:grid;grid-template-columns:7.2em minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.state{font-weight:700;font-size:.875rem;padding:3px 0;text-align:center;border-radius:4px}
.st-accept{background:var(--ok-bg);color:var(--ok)}
.st-pending{background:var(--wait-bg);color:var(--wait)}
.st-decline,.st-closed{background:var(--ng-bg);color:var(--ng)}
.st-chosen{background:var(--ok);color:#fff}
.hname{font-weight:700}
.hmeta{font-size:.8125rem;color:var(--ink-2)}
.tag{font-size:.75rem;border:1px solid var(--stripe);color:var(--stripe);border-radius:4px;padding:0 6px;margin-left:6px;font-weight:400;white-space:nowrap}
.go{padding:11px 14px;border:0;border-radius:8px;background:var(--ok);color:#fff;font-weight:700;cursor:pointer;white-space:nowrap}
li.dim .hname{color:var(--ink-2);font-weight:400}
.decided{border:2px solid var(--ok);background:var(--ok-bg);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.decided strong{font-size:1.25rem;display:block;color:var(--ok)}
.opts{display:flex;align-items:center;gap:8px;font-size:.8125rem;color:var(--ink-2);margin-top:14px;flex-wrap:wrap}

/* hospital */
.standby{text-align:center;padding:48px 12px}
.standby .dot{width:14px;height:14px;border-radius:50%;background:var(--ok);display:inline-block;margin-bottom:10px;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.35}}
.standby b{display:block;font-size:1.125rem;margin-bottom:4px}
.standby p{margin:0;color:var(--ink-2)}
.req{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.req-alert{background:var(--emg);color:#fff;font-weight:700;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-size:1.0625rem}
.req-alert.calm{background:var(--ink-2)}
.req-top{padding:12px 14px;border-left:8px solid var(--sev2);background:var(--surface-2)}
.req-top.s3{border-left-color:var(--sev3)}.req-top.s1{border-left-color:var(--sev1)}
.req.fresh{animation:ring .9s ease-out 3}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--emg) 60%,transparent)}100%{box-shadow:0 0 0 16px transparent}}
@media (prefers-reduced-motion:reduce){.req.fresh,.standby .dot{animation:none}}
.req-main{font-size:1.5rem;font-weight:700;margin:4px 0}
dl.vit{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0;padding:12px 14px}

.req-loc{padding:0 14px 14px;font-size:1rem}

.yes{background:var(--ok);color:#fff;border:0}
.no{background:var(--surface);border:2px solid var(--line)}
.reasons{padding:0 14px 14px}

.note{background:var(--wait-bg);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:.875rem;margin-bottom:12px}
.samples{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
details.more{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px;background:var(--surface)}

textarea{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;resize:vertical}

.chart{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}

.xfer{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:10px}

.sumtext{font-size:.8125rem}

.chart-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}

.qrset{display:flex;flex-direction:column;gap:10px;align-items:center}
.qritem{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px}

.print-only{display:none}
@media (max-width:640px){ .chart-grid{grid-template-columns:1fr} }
@page{size:A4;margin:14mm}
@media print{
  :root{--bg:#fff;--surface:#fff;--surface-2:#fff;--ink:#000;--ink-2:#333;--line:#999}
  body{background:#fff;color:#000;font-size:11pt}
  body *{visibility:hidden}
  .printable,.printable *{visibility:visible}
  .printable{position:absolute;left:0;top:0;width:100%;border:0;padding:0;margin:0}
  .noprint,.noprint *{display:none!important}
  .print-only{display:flex}
  .print-head{justify-content:space-between;align-items:baseline;border-bottom:2px solid #000;padding-bottom:4px;margin-bottom:8px;font-size:10pt}
  .print-head b{font-size:14pt}
  .chart-head h3{display:none}
  .chart-grid{gap:6mm}
  .qrcol{flex-direction:row;align-items:center;justify-content:flex-start;gap:6mm;border-top:1px solid #999;padding-top:4mm;break-inside:avoid}
  .qrcol h4{display:none}
  .qrcol .qrnote{text-align:left;max-width:60mm}
  dl.sumlist{border-top:0;padding-top:0}
  dl.sumlist div{grid-template-columns:24mm minmax(0,1fr);border-bottom:1px solid #ccc;padding:1.5mm 0;break-inside:avoid}
  dl.sumlist dt{color:#333}
  .qrbox.big-qr{width:60mm;padding:0;border:0}
  .qritem{break-inside:avoid}
}

  function startLocal(reason){
    if(store.mode==="local") return;
    if(STANDALONE_SEED&&!Object.keys(local.status).length){ local.status=JSON.parse(JSON.stringify(STANDALONE_SEED.status)); local.logs=JSON.parse(JSON.stringify(STANDALONE_SEED.logs)); }

    setConn("off", "単体版（この端末だけで動作）");
    store.manned = {}; if(view.hid) store.manned[view.hid]=true;
    render();
  }

  function subscribeResp(reqId){
    if(respFor===reqId) return;
    if(respUnsub){respUnsub();respUnsub=null;}
    respFor=reqId; store.resp={}; store.msgs=[];
    if(msgUnsub){msgUnsub();msgUnsub=null;}
    if(!reqId||!db) return;
    msgUnsub = db.collection("msg").where("reqId","==",reqId).onSnapshot(function(q){
      var arr=[]; q.docs.forEach(function(d){var v=d.data(); if(v&&v.text) arr.push(v);});
      arr.sort(function(a,b){return a.at-b.at;}); store.msgs=arr; render();
    },function(){});
    if(ackUnsub){ackUnsub();ackUnsub=null;} store.acks={};
    ackUnsub = db.collection("ack").where("reqId","==",reqId).onSnapshot(function(q){
      var m={}; q.docs.forEach(function(d){var v=d.data(); if(v&&v.hid) m[v.hid]=v;}); store.acks=m; render();
    },function(){});
    respUnsub = db.collection("resp").where("reqId","==",reqId).onSnapshot(function(q){
      var m={}; q.docs.forEach(function(d){var v=d.data(); if(v&&v.hid) m[v.hid]=v;});
      store.resp=m; onData();
    },function(){ setConn("off","回答の受信が止まりました。再読み込みしてください"); });
  }

  async function connect(){
    if(!window.claude || !window.claude.use){ startLocal("共有なし（この端末だけで動作中）"); return; }
    curTimer = setTimeout(function(){ if(store.mode==="loading") startLocal("共有に接続できません（この端末だけで動作中）"); },10000);
    try{ db = await window.claude.use("db"); }catch(e){ db=null; }
    if(!db){ clearTimeout(curTimer); startLocal("共有なし（この端末だけで動作中）"); return; }
    db.doc("live/current").onSnapshot(function(s){
      if(store.mode==="local") return;
      clearTimeout(curTimer);
      if(store.mode==="loading"){ store.mode="shared"; setConn("on","共有中（他の端末と同期）"); }
      var v = s.exists ? s.data() : null;
      store.cur = (v && v.reqId) ? v : null;
      subscribeResp(store.cur ? store.cur.reqId : null);
      onData();
    },function(){ clearTimeout(curTimer); startLocal("共有に接続できません（この端末だけで動作中）"); });
    db.collection("status").onSnapshot(function(q){
      var m={}; q.docs.forEach(function(d){ var v=d.data(); if(v && byId(d.id)) m[d.id]=v; });
      store.status=m; render(); applySchedules();
    },function(){});
    db.collection("log").onSnapshot(function(q){
      var arr=[]; q.docs.forEach(function(d){var v=d.data(); if(v&&v.sentAt) arr.push(v);});
      arr.sort(function(a,b){return a.sentAt-b.sentAt;}); store.logs=arr; render();
    },function(){});

  function shrink(file,max,q){
    return new Promise(function(res,rej){
      var img=new Image(), url=URL.createObjectURL(file);
      img.onload=function(){ var r=Math.min(1,max/Math.max(img.width,img.height)), w=Math.round(img.width*r), h=Math.round(img.height*r);
        var cv=document.createElement("canvas"); cv.width=w; cv.height=h; cv.getContext("2d").drawImage(img,0,0,w,h); URL.revokeObjectURL(url);
        cv.toBlob(function(b){ b?res({blob:b,data:cv.toDataURL("image/jpeg",q)}):rej(); },"image/jpeg",q); };
      img.onerror=function(){ URL.revokeObjectURL(url); rej(); };
      img.src=url;
    });
  }

      if(useAssets){
        return assetsApi.upload(r.blob,{type:"image/jpeg"}).then(function(u){ draft.photos.push({id:u.id,label:label}); })
          .catch(function(){ draft.photos.push({data:r.data,label:label}); });

  function toMin(t){ var m=/^(\d{1,2}):(\d{2})$/.exec(t||""); return m?Number(m[1])*60+Number(m[2]):null; }
  function bandNow(sch){
    var now=new Date(), n=now.getHours()*60+now.getMinutes();

  }

        (er?'<span class="hmeta">救急外来 '+esc(er.label)+'</span>':'')+
        (x.m.length?'<span class="match">✓ '+esc(x.m.join("・"))+' 在院</span>':(comp&&wantFor(comp).length?'<span class="hmeta">主訴に合う専門科なし</span>':''))+

  function commitStatus(redraw){
    var hid=view.hid; if(!hid||!statusDraft) return;
    statusDraft.updatedAt=Date.now(); statusDraft.by=DEVICE;
    if(redraw){ renderStatusEditor(); renderTabs(); }
    if(store.mode!=="shared"){ local.status[hid]=JSON.parse(JSON.stringify(statusDraft)); store.status=local.status; render(); return; }
    if(sWriting){ sAgain=true; return; }
    sWriting=true;
    var body=JSON.parse(JSON.stringify(statusDraft));
    db.doc("status/"+hid).set(body).then(function(){
      if($("sSaved")) $("sSaved").textContent="救急隊に表示中｜更新 たった今";
    }).catch(function(){ if($("sSaved")) $("sSaved").textContent="保存できませんでした。通信状態を確認してください"; })
    .finally(function(){ sWriting=false; if(sAgain){ sAgain=false; commitStatus(false); } });
  }

  function recommend(src){
    var a=areaById(src.area), comp=src.complaint||"", sev=src.sev||2, inReq=!!src.reqId;
    var needs=[]; String(comp).split("・").forEach(function(k){ (NEEDS[k]||[]).forEach(function(n){ if(needs.indexOf(n)<0) needs.push(n); }); });
    return HOSPITALS.map(function(h){
      var st=store.status[h.id], eta=etaMin(a,h), sc=-eta, why=[];
      if(inReq){ var r=stateOf(h.id).st; if(r==="decline"||r==="closed") return null; if(r==="accept"||r==="chosen"){ sc+=15; why.push("受け入れ可と回答"); } else if(r==="cond"){ sc+=8; why.push("条件付きで可"); } }

        var m=matchDepts(comp,st); if(m.length){ sc+=12+(m.length-1)*3; why.push(m.join("・")+"が在院"); } else if(comp) { sc-=6; }

      why.unshift("約"+eta+"分");

      [0,0.35,0.7].forEach(function(t){
        var o=audioCtx.createOscillator(), g=audioCtx.createGain();
        o.frequency.value=880; o.connect(g); g.connect(audioCtx.destination);
        g.gain.setValueAtTime(0.0001,audioCtx.currentTime+t); g.gain.exponentialRampToValueAtTime(0.3,audioCtx.currentTime+t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+t+0.25);

  // QRコード：1枚に収まらないときは行の区切りで分けて複数枚にする
  function utf8len(t){ var n=0; for(var i=0;i<t.length;i++){ var c=t.charCodeAt(i); n+= c<128?1:(c<2048?2:3); } return n; }
  function qrSvg(text){
    var q=window.qrcode(0,"L"); window.qrcode.stringToBytes=window.qrcode.stringToBytesFuncs["UTF-8"];
    q.addData(text,"Byte"); q.make();
    return q.createSvgTag({cellSize:4,margin:4,scalable:true});
  }
  function tryQR(el,text){
    try{ el.innerHTML=qrSvg(text); return true; }catch(e){ el.innerHTML=""; return false; }
  }
  function makeQRSet(box,text){
    box.innerHTML="";
    var parts=[text];
    if(utf8len(text)>1000){
      var lines=text.split("\n"), cur="", limit=900; parts=[];
      lines.forEach(function(l){ var next=cur?cur+"\n"+l:l; if(utf8len(next)>limit && cur){ parts.push(cur); cur=l; } else cur=next; });
      if(cur) parts.push(cur);
    }
    var ok=true;
    parts.forEach(function(t,i){
      var label = parts.length>1 ? "（"+(i+1)+"/"+parts.length+"）" : "";
      var wrap=document.createElement("figure"); wrap.className="qritem";
      var q=document.createElement("div"); q.className="qrbox big-qr"; wrap.appendChild(q);
      if(!tryQR(q, (label?label+"\n":"")+t)){
        // さらに半分に分けて再試行
        var mid=Math.ceil(t.length/2);
        q.innerHTML=""; ok = tryQR(q,(label||"")+"前半\n"+t.slice(0,mid)) && ok;
        var q2=document.createElement("div"); q2.className="qrbox big-qr"; wrap.appendChild(q2);
        ok = tryQR(q2,(label||"")+"後半\n"+t.slice(mid)) && ok;
      }
      if(label){ var cap=document.createElement("figcaption"); cap.textContent="QRコード "+(i+1)+"/"+parts.length+"（順に読み取ってください）"; wrap.appendChild(cap); }
      box.appendChild(wrap);
    });
    if(!ok){ var w=document.createElement("p"); w.className="qrnote"; w.textContent="QRコードを作れませんでした。コピーを使ってください。"; box.appendChild(w); }
  }

    if($("hosEnd")) $("hosEnd").addEventListener("click",function(){
      confirmBox("この患者さんの対応を終了しますか","この端末の受け入れ要請画面は待機に戻ります。カルテ転記用の要約と記録は「受け入れ記録」から確認できます。","対応を終了する",function(){
        var now=Date.now(); hosDone[c.reqId]=true; var x=caseSummary(c,store.resp); x.closedAt=now; hosDoneShow={x:x,by:"hos"};
        audit("病院側で対応を終了",c.complaint);
        if(store.mode==="shared"){ db.doc("log/"+c.reqId).update({hosClosedAt:now}).catch(function(){}); } else { local.logs.forEach(function(r){ if(r.reqId===c.reqId) r.hosClosedAt=now; }); }
        renderHos();
      });
    });
    if($("hosClose")) $("hosClose").addEventListener("click",function(){ hosDone[c.reqId]=true; audit("要請を閉じた",c.complaint); renderHos(); });
    b.querySelectorAll("[data-cd]").forEach(function(btn){btn.addEventListener("click",function(){ans(true,CONDS[Number(btn.getAttribute("data-cd"))],"cond");});});
    b.querySelectorAll("[data-ph]").forEach(function(btn){btn.addEventListener("click",function(){ var ph=c.photos[Number(btn.getAttribute("data-ph"))]; openPhoto(photoSrc(ph),ph.label); });});
    bindMsgs(b);
    if($("yes")) $("yes").addEventListener("click",function(){ans(true);});
    if($("no")) $("no").addEventListener("click",function(){showReasons=true;renderHos();});
    if($("back")) $("back").addEventListener("click",function(){showReasons=false;showCond=false;renderHos();});
    b.querySelectorAll("[data-rs]").forEach(function(btn){btn.addEventListener("click",function(){ans(false,REASONS[Number(btn.getAttribute("data-rs"))]);});});
    bindSnd();
  }
  function bindSnd(){
    var s=$("snd"); if(!s) return;
    s.addEventListener("click",function(){
      soundOn=!soundOn;
      if(soundOn){ try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.resume) audioCtx.resume(); }catch(e){} beep(); }
      renderHos();
    });
  }

  setInterval(function(){ var c=store.cur; if(mapDragging) return; if(c&&(!c.decided||!c.arrivedAt)) render(); },10000);
  // 経過時間の表示だけを更新
  setInterval(function(){
    var c=store.cur; if(!c||c.decided) return;
    var t=fmt(Math.floor((Date.now()-c.sentAt)/1000));
    document.querySelectorAll("[data-clock]").forEach(function(n){n.textContent=t;});
  },500);

  // 画面と照会をまとめてリセット（2回押しで実行）
  var armTimer=null;
  $("resetAll").addEventListener("click",function(){
    var btn=$("resetAll");
    if(!btn.classList.contains("armed")){
      btn.classList.add("armed"); btn.textContent="もう一度押すとリセット";
      armTimer=setTimeout(function(){ btn.classList.remove("armed"); btn.textContent="リセット"; },4000);
      return;
    }
    clearTimeout(armTimer); btn.classList.remove("armed"); btn.textContent="リセット";
    clearSim(); busy=false; showReasons=false; lastSeenReq={}; freshReq=null; autoSim=true; ambDone=null; hosDoneShow=null; prevHos=null;
    draft=SAMPLES.stroke();
    writeCur({reqId:null,status:"idle"}).catch(writeErr);
    if(location.hash) location.hash="";
    go();
  });

  go();
  connect();
})();
</script>
</body>
</html>
